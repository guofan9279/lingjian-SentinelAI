services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./backend/data/sentinelai.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-backend/data/uploads}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before starting the application}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    volumes:
      - ./backend/data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

  postgres:
    image: postgres:16-alpine
    profiles: ['postgres']
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

